<html xmlns:th="http://www.thymeleaf.org">
    
    <a th:fragment="nav-button(link, title, menuItem, icon)"
    th:href="${link}"
    class="flex items-center px-4 py-3 rounded-lg border border-[#333333] hover:bg-[#222222] transition-colors"
    th:classappend="${activeMenuItem == menuItem}? 'bg-[#3b82f6] text-white font-medium shadow-lg shadow-blue-900/50' : 'border border-[#333333] hover:bg-[#222222] transition-colors'">
        <svg th:replace="~{${icon}}"></svg>
        [[${title}]]
    </a>

</html>
