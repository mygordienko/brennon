<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <th:block th:fragment="htmx-error-handlers">
        <script>
            document.addEventListener('htmx:beforeRequest', ev => {
                removeErrorMessage();
            });
            document.addEventListener('htmx:sendError', ev => {
                showErrorMessage('htmx-request-error');
            });
            document.addEventListener('htmx:responseError', ev => {
                showErrorMessage('htmx-request-error');
            });
            document.addEventListener('htmx:timeout', ev => {
                    showErrorMessage('htmx-timeout');
            });
            function removeErrorMessage() {
                const errorParent = document.getElementById('error-parent');
                errorParent.innerHTML = '';
            }
            function showErrorMessage(templateId) {
                const clonedTemplate = document.getElementById(templateId).content.cloneNode(true);
                const errorParent = document.getElementById('error-parent');
                errorParent.innerHTML = '';
                errorParent.appendChild(clonedTemplate);
            }
        </script>
    </th:block>

    <th:block th:fragment="uppyLoader(uploadUrl, targetId, fileListId, selectAttachmentText)">
        <script>
            // NOTE: Important use outer {} to establish scope, so the variables are collected between HTMX swaps
            //    HTMX does not clear/uset variables itself
            {
            const uploadEndpoint = '[[${uploadUrl}]]';
            const targetElementId = '[[${targetId}]]';
            const fileListElementId = '[[${fileListId}]]';
            const selectAttachment = '[[${selectAttachmentText}]]';
            
            const csrfToken = '[[${_csrf?.token}]]';
            const csrfHeader = '[[${_csrf?.headerName}]]';

            const uploadHeaders = {};
            if (csrfHeader && csrfToken) {
                uploadHeaders[csrfHeader] = csrfToken;
            }

            // window.Uppy initialized in index.js
            const { Uppy, FileInput, XHRUpload } = window.Uppy;

            const uppy = new Uppy({
                debug: true,
                autoProceed: true,
                restrictions: {
                    maxFileSize: 5000000, 
                    maxNumberOfFiles: 5
                }
            });

            uppy.use(FileInput, {
                target: '#' + targetElementId,
                locale: {
                    strings: { chooseFiles: selectAttachment }
                }
            });

            uppy.use(XHRUpload, {
                endpoint: uploadEndpoint,
                fieldName: 'file',
                method: 'POST',
                headers: uploadHeaders,
                timeout: 10 * 1000,
            });

            let filesMap = {};

            uppy.on('file-added', (file) => {
                filesMap[file.id] = { name: file.name, serverId: null, progress: 0 };
                renderFileList();
            });

            uppy.on('upload-progress', (file, progress) => {
                if (filesMap[file.id]) {
                    filesMap[file.id].progress = progress.bytesUploaded / progress.bytesTotal * 100;

                    // Update specific progress element in DOM to avoid full re-renders
                    const progressEl = document.getElementById(`progress-${file.id}`);
                    if (progressEl) {
                        progressEl.style.width = `${filesMap[file.id].progress}%`;
                    }
                }
            });

            uppy.on('upload-success', (file, response) => {
                if (filesMap[file.id]) {
                    filesMap[file.id].serverId = response.body.fileId;

                    // Change file styling to completed state
                    const statusText = document.getElementById(`status-${file.id}`);
                    if (statusText) {
                        statusText.innerText = 'Uploaded';
                        statusText.className = 'text-xs text-(--color-content-text-main) font-medium';
                    }

                    updateHiddenInput();
                }
            });

            window.removeCustomFile = function(fileId) {
                uppy.removeFile(fileId);
                delete filesMap[fileId];
                renderFileList();
                updateHiddenInput();
            };

            uppy.on('upload-error', (file, error, response) => {
                console.error(`Failed to upload file: ${file.name}`);
                console.error('Error detail:', error);
                
                if (response) {
                    console.log('Server response status:', response.status);
                }

                const statusText = document.getElementById(`status-${file.id}`);
                if (statusText) {
                    statusText.innerText = 'Error';
                    statusText.className = 'text-xs text-(--color-error-text) font-medium';
                }
            });

            function renderFileList() {
                const listContainer = document.getElementById(fileListElementId);
                const keys = Object.keys(filesMap);

                if (keys.length === 0) {
                    listContainer.classList.add('hidden');
                    listContainer.innerHTML = '';
                    return;
                }

                listContainer.classList.remove('hidden');
                listContainer.innerHTML = keys.map(id => {
                    const file = filesMap[id];
                    const isUploaded = file.serverId !== null;

                    return `
                    <li class="p-3 flex flex-col space-y-1" id="item-${id}">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-(--color-content-text-main) truncate max-w-xs">${file.name}</span>
                            <div class="flex items-center space-x-3">
                                <span id="status-${id}" class="text-xs text-(--color-content-text-main) font-medium">
                                    ${isUploaded ? 'Uploaded' : 'Uploading...'}
                                </span>
                                <button type="button" onclick="window.removeCustomFile('${id}')" class="text-(--color-content-text-main) hover:text-(--color-brand-red) transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        <!-- Continuous custom progress bar wrapper -->
                        <div class="w-full h-1 rounded-full overflow-hidden">
                            <div id="progress-${id}" class="bg-(--color-brand-blue) h-full transition-all duration-150" style="width: ${file.progress}%"></div>
                        </div>
                    </li>
                `;
                }).join('');
            }

            function updateHiddenInput() {
                const ids = Object.values(filesMap)
                    .filter(f => f.serverId !== null)
                    .map(f => f.serverId);

                document.getElementById('concatenated-file-ids').value = ids.join(',');
            }
        }
        </script>
    </th:block>
</body>
