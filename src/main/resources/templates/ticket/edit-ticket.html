<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}"
    th:with="activeMenuItem='editticket'">
<head>
    <title th:text="#{ticket.edittitle}">Edit ticket</title>
</head>
<body>
 <th:block layout:fragment="content">
    <main class="flex-1 flex flex-col p-6 md:p-10 overflow-hidden relative" id= "page-content" th:fragment="page-content-block">
        <th:block th:fragment="edit-details-form">
            <!-- Page Title -->
            <h1 class="text-2xl font-bold text-(--color-content-text-main) mb-6" th:text="#{ticket.edittitle}">Edit ticket</h1>

            <div id="error-parent"></div>
            <template th:replace="~{fragments/error-containers :: htmx-request-error-message}"></template>
            <template th:replace="~{fragments/error-containers :: htmx-timeout-error-message}"></template>

            <!-- Form -->
            <form class="flex flex-col flex-grow space-y-2"
                  th:fragment="ticket-details-form" id="ticket-details-form"
                  th:object="${editDetailsForm}"
                  th:hx-put="@{/tickets/{id}(id=${ticket.id})}"
                  hx-target="#page-content"
                  hx-swap="outerHTML">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{version}" class="ticket-version-input"/>

                <!-- Subject Input -->
                <div class="flex flex-col space-y-2">
                    <label for="subject" 
                           th:text="#{ticket.subject}"
                           class="text-sm font-medium text-(--color-label-text-main)">Subject</label>
                    <input 
                        type="text" 
                        id="subject" 
                        th:field="*{subject}" 
                        class="w-full rounded-md bg-transparent border border-(--color-control-border) text-(--color-content-text-main) px-4 py-2.5 text-sm focus:outline-none focus:border-(--color-control-border-focus) focus:ring-1 focus:ring-blue-500 transition-colors"
                    />
                    <div class="text-(--color-error-text) text-sm font-medium" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}">Validation error</div>
                </div>

                <!-- Message Textarea -->
                <div class="flex flex-col flex-grow">
                    <label for="message" 
                           th:text="#{ticket.message}"
                           class="text-sm font-medium text-(--color-label-text-main)">Message</label>
                    <textarea 
                        id="message" 
                        th:field="*{text}" 
                        class="w-full rounded-md bg-transparent border border-(--color-control-border) text-(--color-content-text-main) px-4 py-2.5 text-sm focus:outline-none focus:border-(--color-control-border-focus) focus:ring-1 focus:ring-blue-500 transition-colors resize-none h-64 md:h-96"
                    ></textarea>
                    <div class="text-(--color-error-text) text-sm font-medium" th:if="${#fields.hasErrors('text')}" th:errors="*{text}">Validation error</div>
                </div>

                <div id="ticket-attachments-container" class="flex py-2 gap-4">
                    <th:block th:each="attachment : ${ticket.attachments()}">
                        <div 
                            th:if="${attachment.currentUserRelation().isAuthor()}"
                            th:id="'attachment-' + ${attachment.id()}"
                            class="flex px-3 py-2 rounded-lg border border-(--color-control-border) hover:bg-[#222222] transition-colors">
                            <!-- NOTE: backend sets Content-Disposition with fileName-->
                            <div th:text="${attachment.name()}"></div>
                            <div class="attachment-id-element" th:text="${attachment.id()}" hidden></div>
                            <button type="button"
                                    th:data-attachment-id="${attachment.id()}"
                                    onclick="window.removeAttachment(this.getAttribute('data-attachment-id'))"
                                    class="text-(--color-content-text-main) hover:text-(--color-brand-red) transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </th:block>
                </div>

                <!-- Custom Upload UI Container -->
                <div class="space-y-2">
                    <div id="custom-upload-picker"
                            type="button" 
                            class="text-(--color-brand-blue) hover:text-(--color-content-text-main) w-fit rounded-md py-2 text-sm font-medium shadow-sm transition-colors"></div>

                    <ul id="custom-file-list" class="divide-y divide-(--color-control-border) border border-(--color-control-border) rounded-lg hidden">
                        <!-- JavaScript will inject <li> items here -->
                    </ul>
                </div>

                <!-- Hidden inputs for file IDs will be generated here dynamically -->
                <input type="hidden" id="concatenated-file-ids" th:field="*{uploadedFileIds}"></input>

                <!-- Hidden inputs for removed attachments -->
                <input type="hidden" id="concatenated-attachment-ids-to-remove" th:field="*{attachmentIdsToRemove}"></input>

                <!-- Footer Actions -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 md:gap-0">

                    <!-- Validation Error Message -->
                    <div th:if="${#fields.hasErrors('*')}" class="text-(--color-error-text) text-sm font-medium">
                        <div th:if="${#fields.hasErrors('global')}">Validation error</div>
                    </div>
                    <!-- Empty placeholder to maintain flex spacing if no error -->
                    <div th:unless="${#fields.hasErrors('*')}"></div>

                    <!-- Buttons -->
                    <div class="flex space-x-4">
                        <button type="submit"
                                th:text="#{common.action.save}"
                                class="bg-(--color-button-regular) hover:bg-(--color-button-regular-hover) text-(--color-content-text-main) font-medium py-1 px-4 rounded text-sm transition-colors">
                            Save
                        </button>
                        <button type="button" 
                                th:text="#{common.action.cancel}"
                                class="bg-(--color-button-regular) hover:bg-(--color-button-regular-hover) text-(--color-content-text-main) font-medium py-1 px-4 rounded text-sm transition-colors"
                                th:hx-get="@{/tickets/{id}(id=${ticket.id})}"
                                hx-target="#page-content"
                                hx-swap="outerHTML">
                            Cancel
                        </button>
                    </div>
                </div>
            </form>
        </th:block>
        <th:block>
            <th:block th:replace="~{ticket/fragments/scripts :: uppyLoader(@{/api/v1/tickets/attachments/upload}, 'custom-upload-picker', 'custom-file-list', #{ticket.choosefile} + ' (only images)')}"></th:block>
            <script>
                window.removeAttachment = function(attachmentId) {
                    console.log("Remove id: " + attachmentId);
                    document.getElementById("attachment-" + attachmentId)?.remove();

                    let idsToRemoveStr = document.getElementById('concatenated-attachment-ids-to-remove').value;

                    const idsToRemoveArr = idsToRemoveStr
                        .split(",")
                        .map(item => item.trim())
                        .filter(item => item !== "");
                    
                    idsToRemoveArr.push(attachmentId);

                    let result = idsToRemoveArr.join(',');

                    console.log("Remove attach ids: " + result);

                    document.getElementById('concatenated-attachment-ids-to-remove').value = result;
                };
            </script>
        </th:block>
    </main>
 </th:block>
</body>
</html>
