<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" th:with="activeMenuItem='mytickets'">

<head>
    <title>My Tickets</title>
</head>

<body>
    <th:block layout:fragment="content">
        <!-- Main container: flex column, full height -->
        <div class="max-w-7xl mx-auto flex flex-col h-full" id="page-content" th:fragment="page-content-block">
            <h1 class="text-2xl font-bold mb-8 flex-shrink-0">My Tickets</h1>

            <th:block layout:fragment="content" th:replace="~{ticket/fragments/ticket-list :: ticket-list(path='/tickets/my')}">
            </th:block>

            <div id="error-parent"></div>
            <template th:replace="~{fragments/error-containers :: htmx-request-error-message}"></template>
            <template th:replace="~{fragments/error-containers :: htmx-timeout-error-message}"></template>
        </div>
    </th:block>
    <th:block layout:fragment="script-content">
        <th:block th:replace="~{ticket/fragments/scripts :: htmx-error-handlers}"></th:block>
    </th:block>
</body>

</html>
