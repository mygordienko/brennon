<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"timeout": 1000}'>
    <title>Brennon</title>
    <!-- Link to compiled Tailwind CSS output file -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script th:src="@{/js/htmx.min.js}"></script>
    <style>
        /* Custom scrollbar to match the screenshot's dark scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
    <script>
        const clientTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone; 
        document.cookie = "BRENNON_CLIENT_TIMEZONE=" + clientTimeZone + "; path=/; max-age=31536000";
    </script>
</head>
<body class="bg-[#111111] text-white h-screen overflow-hidden flex">

    <!-- Sidebar Fragment -->
    <th:block>
        <aside class="w-72 border-r border-[#333333] flex flex-col h-full p-6 bg-[#111111] shrink-0 relative">
            <!-- Top Right Menu Icon -->
            <div class="absolute top-6 right-6 cursor-pointer">
                <svg class="w-6 h-6 text-[#3b82f6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </div>

            <!-- User Profile -->
            <div hx-get="/current-user-profile" hx-trigger="load">
            </div>

            <!-- Navigation -->
            <nav class="flex flex-col space-y-4 flex-1">
                <a th:replace="~{fragments/sidebar-buttons :: nav-button(link=@{/tickets/my}, title='My tickets', menuItem='mytickets', icon='mytickets')}"></a>
                <a th:replace="~{fragments/sidebar-buttons :: nav-button(link=@{/tickets/create}, title='Create ticket', menuItem='createticket', icon='createticket')}"></a>
                <a sec:authorize="hasAuthority('support:read')"
                   th:replace="~{fragments/sidebar-buttons :: nav-button(link=@{/tickets/unassigned}, title='Unassigned tickets', menuItem='unassignedtickets', icon='unassignedtickets')}" ></a>
            </nav>

            <!-- Logout -->
            <div class="mt-auto pt-6 border-t border-[#222222]">
                <form th:action="@{/logout}" method="POST" class="inline-block w-full">
                    <button type="submit" class="w-full flex items-center px-4 py-3 rounded-lg border border-[#333333] hover:bg-[#222222] transition-colors text-left bg-transparent cursor-pointer">
                        <svg class="w-5 h-5 mr-3 text-[#3b82f6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h4m4-12l4 4-4 4m4-4H8"></path>
                        </svg>
                        Logout
                    </button>
                </form>
            </div>
        </aside>
    </th:block>

    <!-- Main Content Wrapper Fragment -->
    <main class="flex-1 h-full overflow-y-auto p-10 bg-[#111111] relative">
        <th:block layout:fragment="content"></th:block>
    </main>
    <th:block layout:fragment="script-content"> <!--.-->
    </th:block>
</body>
</html>
