server:
  port: 8080
  servlet:
    session:
      timeout: 10m

spring:
  application:
    name: brennon
  datasource:
    url: "jdbc:postgresql://localhost:5432/brennon?currentSchema=brennon"
    username: "postgres"
    password: "example"
  # Gives the auto-configured HTML resolver a distinct order priority
  thymeleaf:
    template-resolver-order: 0
    cache: false

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      logging:
        enabled: true
        step: "5s"


logging:
  level:
    com.mygordienko.brennon: "INFO"