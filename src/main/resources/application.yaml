server:
  port: 8080
  servlet:
    session:
      timeout: 10m

spring:
  application:
    name: brennon
  datasource:
    url: "jdbc:postgresql://localhost:5432/brennon?currentSchema=brennon"
    username: "postgres"
    password: "example"
  # Gives the auto-configured HTML resolver a distinct order priority
  thymeleaf:
    template-resolver-order: 0
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      logging:
        enabled: false
        step: "10s"
  otlp:
    metrics:
      export:
        enabled: true
        url: "http://localhost:4318/v1/metrics"
        step: "15s"

logging:
  level:
    com.mygordienko.brennon: "DEBUG"

brennon:
  ticket:
    attachments:
      storage:
        local:
          basefolder: "E:/tmp/brennon"