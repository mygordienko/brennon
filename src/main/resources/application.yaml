server:
  port: 8080
  servlet:
    session:
      timeout: 10m

spring:
  # Disable autoconfiguration, S3-related beans will be created manually
  cloud:
    aws:
      s3:
        enabled: false
  application:
    name: brennon
  datasource:
    url: "jdbc:postgresql://localhost:5432/brennon?currentSchema=brennon"
    username: "postgres"
    password: "example"
  # Gives the auto-configured HTML resolver a distinct order priority
  thymeleaf:
    template-resolver-order: 0
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      logging:
        enabled: false
        step: "10s"
  opentelemetry:
    enabled: true
    tracing:
      export:
        schedule-delay: 5s
        timeout: 30s
        otlp:
          enabled: true
          endpoint: "http://localhost:4318/v1/traces"
  otlp:
    metrics:
      export:
        enabled: true
        url: "http://localhost:4318/v1/metrics"
        step: "15s"

logging:
  level:
    com.mygordienko.brennon: "DEBUG"
#    io.opentelemetry.sdk: "TRACE"
#    io.opentelemetry.instrumentation: "TRACE"
#    org.springframework.jdbc.core: TRACE

brennon:
  ticket:
    attachments:
      storage:
        active: "s3"
        local:
          basefolder: "/brennon"
        s3:
          endpoint: "http://localhost:9000"
          credentials:
            accessKeyId: "rustfsadmin"
            secretAccessKey: "rustfsadminpassword"