# 1. kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.9.2/install.yam
# 2. kubectl get deployment -n envoy-gateway-system

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rest-app
  template:
    metadata:
      labels:
        app: rest-app
    spec:
      containers:
      - name: rest-server
        image: demo-rest-server:0.0.1-SNAPSHOT
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rest-app-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: rest-app
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gateway.envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: l4-network-gateway
  namespace: default
spec:
  gatewayClassName: gateway.envoy
  listeners:
  - name: tcp-80
    protocol: TCP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: rest-app-tcp-route
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: l4-network-gateway
  rules:
  - backendRefs:
    - name: rest-app-svc
      port: 80
