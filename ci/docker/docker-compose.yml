# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: brennon
    expose:
      - 5432
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - ./log:/var/log/brennon:ro
      - ./otel-data:/etc/otelcol-contrib/.data
    depends_on:
      - otel-lgtm

  # Default credentials: admin / admin
  otel-lgtm:
    image: grafana/otel-lgtm
    container_name: otel-lgtm
    restart: always
    ports:
      - 3000:3000
      - 4317:4317
      - 4318:4318

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    security_opt:
      - "no-new-privileges:true" # Preventing Privilege Escalation
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs # Storage path inside container
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadminpassword
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  brennon:
    image: brennon:0.0.1-SNAPSHOT
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/brennon?currentSchema=brennon"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "example"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-lgtm:4318/v1/metrics"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-lgtm:4318/v1/traces"
      BRENNON_TICKET_ATTACHMENTS_STORAGE_ACTIVE: "s3"
      BRENNON_TICKET_ATTACHMENTS_STORAGE_S3_ENDPOINT: "http://rustfs:9000"
      BRENNON_TICKET_ATTACHMENTS_STORAGE_S3_CREDENTIALS_ACCESS_KEY_ID: "rustfsadmin"
      BRENNON_TICKET_ATTACHMENTS_STORAGE_S3_CREDENTIALS_SECRET_ACCESS_KEY: "rustfsadminpassword"
    restart: always
    volumes:
      - ./log:/var/log/brennon
    depends_on:
      - db
      - rustfs
      - otel-lgtm
    ports:
      - 8080:8080


volumes:
  rustfs_data:
  app-logs: