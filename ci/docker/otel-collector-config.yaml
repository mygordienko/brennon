receivers:
  filelog:
    include: [ /var/log/brennon/application.log ]
    start_at: end
    storage: file_storage

extensions:
  file_storage:
    directory: /etc/otelcol-contrib/.data
    create_directory: true

exporters:
  otlp_http:
    endpoint: "http://otel-lgtm:4318"
    tls:
      insecure: true

service:
  extensions: [ file_storage ]
  pipelines:
    logs:
      receivers: [ filelog ]
      exporters: [ otlp_http ]